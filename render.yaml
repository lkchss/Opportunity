services:
  - type: web
    # Service name drives the free URL: opportunity-law.onrender.com
    name: opportunity-law
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-law.txt
    # --workers 1 keeps the in-memory usage counters (GET /stats) authoritative;
    # the per-event stdout log is the durable record either way. Fine on free tier.
    startCommand: gunicorn law.server:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      # SITE_BASE_URL (optional) — set to the production origin in the Render
      # dashboard so SEO canonical/OG/sitemap URLs are absolute. If unset, the
      # app derives it from the request (honoring X-Forwarded-Proto).
      - key: SITE_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
