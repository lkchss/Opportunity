services:
  - type: web
    name: law-school-matcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-law.txt
    # --workers 1 keeps the in-memory usage counters (GET /stats) authoritative;
    # the per-event stdout log is the durable record either way. Fine on free tier.
    startCommand: gunicorn law.server:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      # Shared site password — set this value in the Render dashboard at deploy
      # time (sync:false means Render will prompt rather than read it from here,
      # so the password never lands in the repo).
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
